#:schema https://smyklot.com/schema/workspace-panel-v1.json

allow_draft_merges = true

[formatting]
[formatting.common]
inline_max_chars = 100

[formatting.json]
arrays = 'auto'
objects = 'auto'

[panel]
version = 1
scope = 'workspace'

[panel.settings]
repository_default_enabled = true
merge_mode = 'checks'

[panel.settings.protected_refs]
include = ['~DEFAULT_BRANCH']
exclude = []

[panel.sync]
[panel.sync.files]
enabled = true
document = "{\"files\":[{\"path\":\"CODE_OF_CONDUCT.md\",\"content\":\"# Contributor Covenant Code of Conduct\\n\\n## Our Pledge\\n\\nWe as members, contributors, and leaders pledge to make participation in our community a harassment-free experience for everyone, regardless of age, body size, visible or invisible disability, ethnicity, sex characteristics, gender identity and expression, level of experience, education, socio-economic status, nationality, personal appearance, race, caste, color, religion, or sexual identity and orientation.\\n\\nWe pledge to act and interact in ways that contribute to an open, welcoming, diverse, inclusive, and healthy community.\\n\\n## Our Standards\\n\\nExamples of behavior that contributes to a positive environment for our community include:\\n\\n- Demonstrating empathy and kindness toward other people\\n- Being respectful of differing opinions, viewpoints, and experiences\\n- Giving and gracefully accepting constructive feedback\\n- Accepting responsibility and apologizing to those affected by our mistakes, and learning from the experience\\n- Focusing on what is best not just for us as individuals, but for the overall community\\n\\nExamples of unacceptable behavior include:\\n\\n- The use of sexualized language or imagery, and sexual attention or advances of any kind\\n- Trolling, insulting or derogatory comments, and personal or political attacks\\n- Public or private harassment\\n- Publishing others' private information, such as a physical or email address, without their explicit permission\\n- Other conduct which could reasonably be considered inappropriate in a professional setting\\n\\n## Enforcement Responsibilities\\n\\nCommunity leaders are responsible for clarifying and enforcing our standards of acceptable behavior and will take appropriate and fair corrective action in response to any behavior that they deem inappropriate, threatening, offensive, or harmful.\\n\\nCommunity leaders have the right and responsibility to remove, edit, or reject comments, commits, code, wiki edits, issues, and other contributions that are not aligned to this Code of Conduct, and will communicate reasons for moderation decisions when appropriate.\\n\\n## Scope\\n\\nThis Code of Conduct applies within all community spaces, and also applies when an individual is officially representing the community in public spaces. Examples of representing our community include using an official email address, posting via an official social media account, or acting as an appointed representative at an online or offline event.\\n\\n## Enforcement\\n\\nInstances of abusive, harassing, or otherwise unacceptable behavior may be reported to the community leaders responsible for enforcement at [bartek@smykla.com](mailto:bartek@smykla.com).\\n\\nAll complaints will be reviewed and investigated promptly and fairly.\\n\\nAll community leaders are obligated to respect the privacy and security of the reporter of any incident.\\n\\n## Enforcement Guidelines\\n\\nCommunity leaders will follow these Community Impact Guidelines in determining the consequences for any action they deem in violation of this Code of Conduct:\\n\\n### 1. Correction\\n\\n**Community Impact**: Use of inappropriate language or other behavior deemed unprofessional or unwelcome in the community.\\n\\n**Consequence**: A private, written warning from community leaders, providing clarity around the nature of the violation and an explanation of why the behavior was inappropriate. A public apology may be requested.\\n\\n### 2. Warning\\n\\n**Community Impact**: A violation through a single incident or series of actions.\\n\\n**Consequence**: A warning with consequences for continued behavior. No interaction with the people involved, including unsolicited interaction with those enforcing the Code of Conduct, for a specified period of time. This includes avoiding interactions in community spaces as well as external channels like social media. Violating these terms may lead to a temporary or permanent ban.\\n\\n### 3. Temporary Ban\\n\\n**Community Impact**: A serious violation of community standards, including sustained inappropriate behavior.\\n\\n**Consequence**: A temporary ban from any sort of interaction or public communication with the community for a specified period of time. No public or private interaction with the people involved, including unsolicited interaction with those enforcing the Code of Conduct, is allowed during this period. Violating these terms may lead to a permanent ban.\\n\\n### 4. Permanent Ban\\n\\n**Community Impact**: Demonstrating a pattern of violation of community standards, including sustained inappropriate behavior, harassment of an individual, or aggression toward or disparagement of classes of individuals.\\n\\n**Consequence**: A permanent ban from any sort of public interaction within the community.\\n\\n## Attribution\\n\\nThis Code of Conduct is adapted from the [Contributor Covenant][homepage], version 2.1, available at [https://www.contributor-covenant.org/version/2/1/code_of_conduct.html][v2.1].\\n\\nCommunity Impact Guidelines were inspired by [Mozilla's code of conduct enforcement ladder][Mozilla CoC].\\n\\nFor answers to common questions about this code of conduct, see the FAQ at [https://www.contributor-covenant.org/faq][FAQ]. Translations are available at [https://www.contributor-covenant.org/translations][translations].\\n\\n[homepage]: https://www.contributor-covenant.org\\n[v2.1]: https://www.contributor-covenant.org/version/2/1/code_of_conduct.html\\n[Mozilla CoC]: https://github.com/mozilla/diversity\\n[FAQ]: https://www.contributor-covenant.org/faq\\n[translations]: https://www.contributor-covenant.org/translations\\n\"},{\"path\":\"CONTRIBUTING.md\",\"content\":\"# Contributing to Smykla Skalski Projects\\n\\nThank you for your interest in contributing! This document provides guidelines and instructions for contributing to Smykla Skalski projects.\\n\\n## Code of Conduct\\n\\nThis project adheres to a Code of Conduct. By participating, you are expected to uphold this code. Please report unacceptable behavior to the project maintainers.\\n\\n## Getting Started\\n\\n### Prerequisites\\n\\nCheck the project's README for specific prerequisites. Common requirements include:\\n\\n- [mise](https://mise.jdx.dev/) for tool version management\\n- Project-specific tools managed by mise\\n\\n### Setup\\n\\n1. Fork the repository on GitHub\\n2. Clone your fork:\\n\\n   ```bash\\n   git clone https://github.com/YOUR_USERNAME/REPO_NAME.git\\n   cd REPO_NAME\\n   ```\\n\\n3. Add upstream remote:\\n\\n   ```bash\\n   git remote add upstream https://github.com/smykla-skalski/REPO_NAME.git\\n   ```\\n\\n4. Install dependencies (if applicable):\\n\\n   ```bash\\n   mise install\\n   ```\\n\\n## Development Workflow\\n\\n### Branch Naming\\n\\nCreate descriptive, kebab-case branches with a type prefix:\\n\\n```bash\\ngit checkout -b feat/add-feature\\ngit checkout -b fix/bug-description\\ngit checkout -b docs/update-readme\\n```\\n\\nValid branch types: `feat`, `fix`, `docs`, `style`, `refactor`, `test`, `chore`, `ci`, `build`, `perf`\\n\\n### Making Changes\\n\\n1. **Create a feature branch** from `main`:\\n\\n   ```bash\\n   git fetch upstream\\n   git checkout -b feat/my-feature upstream/main\\n   ```\\n\\n2. **Make your changes**:\\n   - Follow project-specific coding standards\\n   - Keep changes focused and minimal\\n   - Add comments where logic isn't self-evident\\n   - Update documentation if needed\\n\\n3. **Run quality checks** (if applicable):\\n\\n   ```bash\\n   make check  # or task check\\n   ```\\n\\n4. **Commit your changes** (see [Commit Guidelines](#commit-guidelines))\\n\\n5. **Push to your fork**:\\n\\n   ```bash\\n   git push origin feat/my-feature\\n   ```\\n\\n## Commit Guidelines\\n\\n### Commit Message Format\\n\\nFollow [Conventional Commits](https://www.conventionalcommits.org/) format:\\n\\n```text\\ntype(scope): description\\n\\nOptional body with more details.\\nLines should be ≤72 characters.\\n```\\n\\n### Commit Message Rules\\n\\n- **Title**: ≤50 characters\\n- **Body lines**: ≤72 characters\\n- **Type**: Use appropriate type for the change\\n- **Scope**: Use lowercase, descriptive scope\\n- **Description**: Clear, concise summary in imperative mood\\n\\n### Commit Types\\n\\n**User-facing changes**:\\n\\n- `feat`: New feature for users\\n- `fix`: Bug fix for users\\n\\n**Infrastructure changes** (use specific type, NOT `feat` or `fix`):\\n\\n- `ci`: CI/CD changes\\n- `test`: Test changes\\n- `docs`: Documentation changes\\n- `build`: Build system changes\\n- `chore`: Maintenance tasks\\n- `refactor`: Code refactoring\\n- `style`: Code style changes\\n- `perf`: Performance improvements\\n\\n### Examples\\n\\n✅ **Good**:\\n\\n```text\\nfeat(api): add user authentication endpoint\\n\\nci(workflows): update release workflow\\n\\ntest(parser): add edge case tests\\n```\\n\\n❌ **Bad**:\\n\\n```text\\nfix(ci): update workflow  # Use ci(...) instead\\nfeat(test): add helper    # Use test(...) instead\\nupdate code              # Missing type/scope\\n```\\n\\n## Pull Request Process\\n\\n### Creating a Pull Request\\n\\n1. **Ensure your branch is up to date**:\\n\\n   ```bash\\n   git fetch upstream\\n   git rebase upstream/main\\n   ```\\n\\n2. **Run quality checks** (if applicable)\\n\\n3. **Push your changes**:\\n\\n   ```bash\\n   git push origin feat/my-feature\\n   ```\\n\\n4. **Create PR** using semantic title:\\n\\n   ```bash\\n   gh pr create --title \\\"feat(scope): description\\\" --body \\\"...\\\"\\n   ```\\n\\n### PR Title Format\\n\\nUse same format as commit messages:\\n\\n```text\\ntype(scope): description\\n```\\n\\n### PR Guidelines\\n\\n- Keep PRs focused on a single concern\\n- Link related issues using `Fixes #123` or `Relates to #456`\\n- Respond to review comments promptly\\n- Update PR based on feedback\\n- Ensure all CI checks pass\\n\\n## Getting Help\\n\\n- **Issues**: Open an issue in the relevant repository\\n- **Discussions**: Use GitHub Discussions if available\\n\\n## License\\n\\nBy contributing, you agree that your contributions will be licensed under the project's license.\\n\"},{\"path\":\"LICENSE\",\"content\":\"MIT License\\n\\nCopyright (c) 2025 Smykla Skalski\\n\\nPermission is hereby granted, free of charge, to any person obtaining a copy\\nof this software and associated documentation files (the \\\"Software\\\"), to deal\\nin the Software without restriction, including without limitation the rights\\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\\ncopies of the Software, and to permit persons to whom the Software is\\nfurnished to do so, subject to the following conditions:\\n\\nThe above copyright notice and this permission notice shall be included in all\\ncopies or substantial portions of the Software.\\n\\nTHE SOFTWARE IS PROVIDED \\\"AS IS\\\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\\nSOFTWARE.\\n\"},{\"path\":\"SECURITY.md\",\"content\":\"# Security Policy\\n\\n## Supported Versions\\n\\nWe release patches for security vulnerabilities for the following versions:\\n\\n| Version | Supported          |\\n| ------- | ------------------ |\\n| latest  | :white_check_mark: |\\n\\n## Reporting a Vulnerability\\n\\nIf you discover a security vulnerability, please report it by emailing the maintainers directly rather than opening a public issue.\\n\\n**Please do not report security vulnerabilities through public GitHub issues.**\\n\\n### Contact Information\\n\\n- **Email**: [bartek@smykla.com](mailto:bartek@smykla.com)\\n- **GitHub Security Advisories**: Use the \\\"Security\\\" tab in the relevant repository\\n\\n### What to Include\\n\\nPlease provide as much information as possible about the vulnerability:\\n\\n- Description of the vulnerability\\n- Steps to reproduce\\n- Potential impact\\n- Suggested fix (if available)\\n\\n### Response Timeline\\n\\n- **Acknowledgment**: We will acknowledge receipt of your vulnerability report within 48 hours\\n- **Investigation**: We will investigate and validate the reported vulnerability\\n- **Fix**: We will develop and test a fix\\n- **Release**: We will release a security update\\n- **Disclosure**: We will publicly disclose the vulnerability after the fix is released\\n\\n### Coordinated Disclosure\\n\\nPlease allow time for the vulnerability to be fixed before public disclosure.\\n\\n## Security Best Practices\\n\\nWhen contributing to Smykla Skalski projects:\\n\\n- Keep dependencies up to date\\n- Never commit secrets, credentials, or API keys\\n- Use environment variables for sensitive configuration\\n- Follow the principle of least privilege\\n- Review code changes for security implications\\n\\n## Acknowledgments\\n\\nWe appreciate the security research community's efforts to responsibly disclose vulnerabilities.\\n\"},{\"path\":\"renovate.json\",\"content\":\"{\\n  \\\"$schema\\\": \\\"https://docs.renovatebot.com/renovate-schema.json\\\",\\n  \\\"extends\\\": [\\n    \\\"config:best-practices\\\",\\n    \\\":semanticCommits\\\",\\n    \\\":gitSignOff\\\",\\n    \\\":dependencyDashboard\\\",\\n    \\\":label(dependencies)\\\",\\n    \\\":rebaseStalePrs\\\",\\n    \\\":enableVulnerabilityAlertsWithAdditionalLabel(kind/security)\\\",\\n    \\\":automergeMinor\\\",\\n    \\\":automergeDigest\\\",\\n    \\\":automergeLinters\\\",\\n    \\\":automergeTesters\\\",\\n    \\\":prConcurrentLimit20\\\",\\n    \\\"helpers:pinGitHubActionDigests\\\",\\n    \\\"security:openssf-scorecard\\\",\\n    \\\"group:linters\\\"\\n  ],\\n  \\\"ignorePaths\\\": [\\n    \\\"**/tmp/**\\\",\\n    \\\".github/workflows/smyklot-pr-commands.yml\\\",\\n    \\\".github/workflows/smyklot-poll.yml\\\"\\n  ],\\n  \\\"osvVulnerabilityAlerts\\\": true,\\n  \\\"gitIgnoredAuthors\\\": [\\\"205507218+smyklot[bot]@users.noreply.github.com\\\"],\\n  \\\"automergeStrategy\\\": \\\"squash\\\",\\n  \\\"packageRules\\\": [\\n    {\\n      \\\"addLabels\\\": [\\\"area/ci\\\"],\\n      \\\"commitMessageTopic\\\": \\\"{{depName}} action\\\",\\n      \\\"description\\\": \\\"GitHub Actions dependencies\\\",\\n      \\\"matchManagers\\\": [\\\"github-actions\\\"],\\n      \\\"semanticCommitType\\\": \\\"ci\\\"\\n    },\\n    {\\n      \\\"description\\\": \\\"Group Go tool dependencies\\\",\\n      \\\"groupName\\\": \\\"Go tooling\\\",\\n      \\\"matchDepTypes\\\": [\\\"require\\\"],\\n      \\\"matchManagers\\\": [\\\"gomod\\\"],\\n      \\\"matchPackageNames\\\": [\\\"/^golang.org/x/tools/\\\"]\\n    },\\n    {\\n      \\\"description\\\": [\\n        \\\" Group dependency bumps from selected GitHub sources into a single PR across managers\\\",\\n        \\\" (e.g., mise and gomod) to avoid separate PRs per manager\\\"\\n      ],\\n      \\\"matchSourceUrls\\\": [\\\"https://github.com/{onsi/ginkgo,golangci/golangci-lint}\\\"],\\n      \\\"groupName\\\": \\\"{{{replace 'https://github\\\\\\\\.com/[a-z-]+/' '' sourceUrl}}}\\\"\\n    },\\n    {\\n      \\\"description\\\": \\\"Group Go version updates from gomod and mise into a single PR\\\",\\n      \\\"groupName\\\": \\\"go version\\\",\\n      \\\"matchDepNames\\\": [\\\"go\\\"],\\n      \\\"matchManagers\\\": [\\\"gomod\\\", \\\"mise\\\"],\\n      \\\"rangeStrategy\\\": \\\"bump\\\"\\n    },\\n    {\\n      \\\"description\\\": \\\"Smyklot action managed by sync-smyklot workflow\\\",\\n      \\\"enabled\\\": false,\\n      \\\"matchManagers\\\": [\\\"github-actions\\\"],\\n      \\\"matchPackageNames\\\": [\\\"smykla-skalski/smyklot\\\"]\\n    }\\n  ],\\n  \\\"vulnerabilityAlerts\\\": {\\n    \\\"automerge\\\": true\\n  }\\n}\\n\"},{\"path\":\".github/PULL_REQUEST_TEMPLATE.md\",\"content\":\"# Summary\\n\\n\\u003c!-- Provide 1-3 bullet points describing the changes --\\u003e\\n\\n## Motivation\\n\\n\\u003c!-- Why is this change needed? What problem does it solve? --\\u003e\\n\\n## Implementation information\\n\\n\\u003c!--\\nBullet list of key implementation details:\\n\\n- Technical decisions made\\n- Files/components modified\\n- Notable patterns or approaches used\\n--\\u003e\\n\\n\\u003c!--\\nSupporting documentation (optional):\\n\\nUncomment and use this section when you have relevant links to add.\\nDo NOT use placeholder values like \\\"N/A\\\", \\\"none\\\", or \\\"-\\\".\\nIf there's nothing to link, simply omit this section entirely.\\n\\n## Supporting documentation\\n\\n- [Issue #123](link)\\n- [Related discussion](link)\\n- [External documentation](link)\\n--\\u003e\\n\"},{\"path\":\".github/ISSUE_TEMPLATE/bug_report.yml\",\"content\":\"name: Bug Report\\ndescription: Report a bug or unexpected behavior\\nlabels: [kind/bug]\\nbody:\\n  - type: markdown\\n    attributes:\\n      value: |\\n        Thank you for reporting a bug! Please fill out the information below to help us fix the issue.\\n\\n  - type: textarea\\n    id: description\\n    attributes:\\n      label: Description\\n      description: A clear and concise description of the bug\\n      placeholder: What went wrong?\\n    validations:\\n      required: true\\n\\n  - type: textarea\\n    id: steps\\n    attributes:\\n      label: Steps to Reproduce\\n      description: Steps to reproduce the behavior\\n      placeholder: |\\n        1. Run command `...`\\n        2. See error `...`\\n    validations:\\n      required: true\\n\\n  - type: textarea\\n    id: expected\\n    attributes:\\n      label: Expected Behavior\\n      description: What did you expect to happen?\\n      placeholder: Describe the expected behavior\\n    validations:\\n      required: true\\n\\n  - type: textarea\\n    id: actual\\n    attributes:\\n      label: Actual Behavior\\n      description: What actually happened?\\n      placeholder: Describe the actual behavior\\n    validations:\\n      required: true\\n\\n  - type: textarea\\n    id: environment\\n    attributes:\\n      label: Environment\\n      description: Please provide information about your environment\\n      placeholder: |\\n        - OS: [e.g., macOS 14.0, Ubuntu 22.04]\\n        - Version: [e.g., v1.0.0 or commit hash]\\n      render: markdown\\n    validations:\\n      required: true\\n\\n  - type: textarea\\n    id: additional\\n    attributes:\\n      label: Additional Context\\n      description: Any other context or information that might be helpful\\n      placeholder: Add any other context about the problem here\\n\"},{\"path\":\".github/ISSUE_TEMPLATE/config.yml\",\"content\":\"blank_issues_enabled: true\\ncontact_links:\\n  - name: Discussions\\n    url: https://github.com/orgs/smykla-skalski/discussions\\n    about: Ask questions and discuss ideas with the community\\n\"}],\"retired\":[\".github/workflows/sync-trigger.yml\"]}"

[panel.sync.labels]
enabled = true
document = "{\"labels\":[{\"name\":\"kind/bug\",\"color\":\"d73a4a\",\"description\":\"Something isn't working\"},{\"name\":\"kind/enhancement\",\"color\":\"a2eeef\",\"description\":\"New feature or request\"},{\"name\":\"kind/documentation\",\"color\":\"0075ca\",\"description\":\"Improvements or additions to documentation\"},{\"name\":\"kind/question\",\"color\":\"d876e3\",\"description\":\"Further information is requested\"},{\"name\":\"kind/security\",\"color\":\"d73a4a\",\"description\":\"Security-related issues and improvements\"},{\"name\":\"area/ci\",\"color\":\"fbca04\",\"description\":\"CI/CD and automation\"},{\"name\":\"area/docs\",\"color\":\"0075ca\",\"description\":\"Documentation\"},{\"name\":\"area/api\",\"color\":\"1d76db\",\"description\":\"API and interfaces\"},{\"name\":\"area/testing\",\"color\":\"bfd4f2\",\"description\":\"Testing and test infrastructure\"},{\"name\":\"area/dependencies\",\"color\":\"ededed\",\"description\":\"Dependencies and dependency management\"},{\"name\":\"release\",\"color\":\"6f42c1\",\"description\":\"Trigger release (version determined by commits)\"},{\"name\":\"release/major\",\"color\":\"d73a4a\",\"description\":\"Trigger major version release (breaking changes)\"},{\"name\":\"release/minor\",\"color\":\"a2eeef\",\"description\":\"Trigger minor version release (new features)\"},{\"name\":\"release/patch\",\"color\":\"c2e0c6\",\"description\":\"Trigger patch version release (bug fixes)\"},{\"name\":\"org-sync\",\"color\":\"0e8a16\",\"description\":\"Organization-wide file and label synchronization\"},{\"name\":\"smyklot:pending:ci\",\"color\":\"fef2c0\",\"description\":\"Pending CI - merge commit\"},{\"name\":\"smyklot:pending:ci:squash\",\"color\":\"fef2c0\",\"description\":\"Pending CI - squash merge\"},{\"name\":\"smyklot:pending:ci:rebase\",\"color\":\"fef2c0\",\"description\":\"Pending CI - rebase merge\"},{\"name\":\"smyklot:pending:ci:required\",\"color\":\"fef2c0\",\"description\":\"Pending CI - merge commit, required checks only\"},{\"name\":\"smyklot:pending:ci:squash:required\",\"color\":\"fef2c0\",\"description\":\"Pending CI - squash merge, required checks only\"},{\"name\":\"smyklot:pending:ci:rebase:required\",\"color\":\"fef2c0\",\"description\":\"Pending CI - rebase merge, required checks only\"},{\"name\":\"review/destructive\",\"color\":\"d73a4a\",\"description\":\"Contains deletions - requires careful manual review\"},{\"name\":\"triage/duplicate\",\"color\":\"cfd3d7\",\"description\":\"This issue or pull request already exists\"},{\"name\":\"triage/wontfix\",\"color\":\"ffffff\",\"description\":\"This will not be worked on\"},{\"name\":\"triage/invalid\",\"color\":\"e4e669\",\"description\":\"This doesn't seem right\"},{\"name\":\"triage/needs-info\",\"color\":\"d876e3\",\"description\":\"Additional information needed\"},{\"name\":\"priority/low\",\"color\":\"c5def5\",\"description\":\"Low priority\"},{\"name\":\"priority/medium\",\"color\":\"fbca04\",\"description\":\"Medium priority\"},{\"name\":\"priority/high\",\"color\":\"ff9f1c\",\"description\":\"High priority\"},{\"name\":\"priority/critical\",\"color\":\"d73a4a\",\"description\":\"Critical priority - needs immediate attention\"}],\"allow_removal\":true}"

[panel.sync.rulesets]
enabled = true
document = '{"rulesets":[{"name":"main-branch-protection","target":"branch","enforcement":"active","conditions":{"include":["refs/heads/main"]},"bypass_actors":[{"actor_id":5,"actor_type":"OrganizationAdmin","bypass_mode":"always"},{"actor_id":1197525,"actor_type":"Integration","bypass_mode":"exempt"}],"rules":{"deletion":true,"non_fast_forward":true,"required_linear_history":true,"required_signatures":true,"pull_request":{"required_approving_review_count":1,"dismiss_stale_reviews_on_push":true,"require_code_owner_review":true,"require_last_push_approval":true,"required_review_thread_resolution":true,"allowed_merge_methods":["squash"]}}}],"allow_removal":false}'

[panel.sync.settings]
enabled = true
document = '{"allow_merge_commit":false,"allow_squash_merge":true,"allow_rebase_merge":false,"allow_auto_merge":true,"delete_branch_on_merge":true,"allow_update_branch":true,"squash_merge_commit_title":"PR_TITLE","squash_merge_commit_message":"BLANK","has_issues":true,"has_projects":false,"has_wiki":false,"has_discussions":false,"secret_scanning":true,"secret_scanning_push_protection":true,"dependabot_security_updates":true}'

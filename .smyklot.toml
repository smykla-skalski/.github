#:schema https://smyklot.com/schema/repository-panel-v1.json

[panel]
version = 1
scope = "repository"

# Keep .github's Renovate PR-only bypass in its local ruleset.
[panel.sync.rulesets]
enabled = false
document = "{}"

[panel.sync.files]
document = '{"merges":[{"overrides":{"github-actions":{"managerFilePatterns":["/smyklot-templates/.+\\.ya?ml$/"]}},"path":"renovate.json","strategy":"deep-merge"}]}'
